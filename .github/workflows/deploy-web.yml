name: Deploy web to VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: production-web
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy web
    if: github.repository == 'ETH-APPS/eth-web' && github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - Linux
      - X64
      - eth-web-production
    timeout-minutes: 30

    steps:
      - name: Deploy current origin/main
        shell: bash
        run: sudo -n /usr/local/sbin/deploy-eth-web
